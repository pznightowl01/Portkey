{% extends "base.html" %}

{% block title %}Login - Portkey{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 border-4 border-amber-200">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-800">🔒 Login to Portkey</h2>
        </div>

        <form method="POST" action="/login">
            <!-- Username -->
            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">Username</label>
                <input 
                    type="text" 
                    name="username" 
                    required
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-amber-600"
                    placeholder="Enter your username"
                >
            </div>

            <!-- Password -->
            <div class="mb-4">
                <label class="block text-gray-700 font-semibold mb-2">Password</label>
                <input 
                    type="password" 
                    name="password" 
                    required
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-amber-600"
                    placeholder="Enter your password"
                >
            </div>

            <!-- Forgot Password Link -->
            <div class="mb-6 text-right">
                <a href="/forgot-password" class="text-orange-600 hover:text-orange-700 font-semibold text-sm">
                    Forgot Password?
                </a>
            </div>

            <!-- Login Button -->
            <button 
                type="submit"
                class="w-full bg-gradient-to-r from-orange-600 to-orange-700 text-white py-3 rounded-lg font-bold text-lg hover:from-orange-700 hover:to-orange-800 transition shadow-lg"
            >
                Login
            </button>
        </form>

        <!-- Sign Up Link -->
        <p class="text-center mt-6 text-gray-600">
            Don't have an account? 
            <a href="/register" class="text-orange-600 hover:text-orange-700 font-semibold">
                Sign up here
            </a>
        </p>
    </div>
</div>
{% endblock %}
