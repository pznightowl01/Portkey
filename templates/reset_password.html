{% extends "base.html" %}
{% block title %}Reset Password - Portkey{% endblock %}
{% block content %}
<div class="min-h-screen flex items-center justify-center py-12 px-4">
    <div class="max-w-md w-full bg-white rounded-2xl shadow-2xl p-8 border-4 border-amber-200">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-bold text-gray-800">🔐 Reset Your Password</h2>
            <p class="text-gray-600 mt-2">Enter your new password below.</p>
        </div>

        <form method="POST" action="/reset-password/{{ token }}">
            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">New Password</label>
                <input
                    type="password"
                    name="new_password"
                    required
                    minlength="6"
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-amber-600"
                    placeholder="Enter new password (min 6 characters)"
                >
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 font-semibold mb-2">Confirm New Password</label>
                <input
                    type="password"
                    name="confirm_password"
                    required
                    minlength="6"
                    class="w-full px-4 py-3 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-amber-600"
                    placeholder="Confirm new password"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-gradient-to-r from-orange-600 to-orange-700 text-white py-3 rounded-lg font-bold text-lg hover:from-orange-700 hover:to-orange-800 transition shadow-lg"
            >
                Reset Password
            </button>
        </form>

        <p class="text-center mt-6 text-gray-600">
            Remember your password?
            <a href="/login" class="text-orange-600 hover:text-orange-700 font-semibold">
                Back to Login
            </a>
        </p>
    </div>
</div>
{% endblock %}
